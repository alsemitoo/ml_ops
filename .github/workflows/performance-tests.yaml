name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        torch-version: ["2.5.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --dev
          uv pip install torch==${{ matrix.torch-version }} torchvision --index-url https://download.pytorch.org/whl/cpu
          uv tree

      - name: Start API server
        run: |
          uv run uvicorn ml_ops_project.api:app --host 127.0.0.1 --port 8000 & sleep 3

      - name: Run load tests
        env:
          UV_HTTP_TIMEOUT: 1200
        run: |
          uv run locust -f tests/performancetests/locustfile.py --host http://localhost:8000 --users 20 --spawn-rate 5 --run-time 30s --headless
