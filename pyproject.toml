[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "ml_ops_project"
version = "0.0.1"
description = "Machine Learning Operation Project"
authors = [
  { name = "Group 46", email = "your@email.com" },
]
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "datasets>=4.4.2",
    "dvc>=3.66.1",
    "dvc-gdrive>=3.0.1",
    "dvc-gs>=3.0.2",
    "fastapi==0.115.6",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "pillow>=12.1.0",
    "scipy>=1.14.0",
    "streamlit>=1.39.0",
    "python-multipart>=0.0.21",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "httpx>=0.28.1",
    "locust>=2.43.1",
    "evidently>=0.7.20",
    "scikit-learn>=1.8.0",
    "pandas>=2.3.3",
    "prometheus-client>=0.24.1",
    "markdown>=3.10.1",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "mkdocs-material==9.4.6",
    "mkdocs==1.6.1",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mkdocstrings-python==1.12.2",
    "mypy>=1.19.1",
    "types-tqdm>=4.67.0.20250809",
    "pytest-asyncio>=1.3.0",
    "pandas-stubs>=2.3.3.260113",
    "types-pillow>=10.2.0.20240822",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
lint.select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["ml_ops_project"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'"
]
[project.scripts]
download-data = "ml_ops_project.data:download_data"
train-model = "ml_ops_project.train:train"

[tool.pytest.ini_options]
markers = [
    "full_dataset: marks tests running with full dataset (deselect with '-m \"not full_dataset\"')",
    "serial",
]
addopts = "-m 'not full_dataset'"

detect-drift = "ml_ops_project.data_drift:main"
